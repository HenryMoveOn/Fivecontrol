name: Build Fivecontrol

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (roothide)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/install.log"
          : > "$LOG"
          echo "### attempt: install-theos (authenticated)" >> "$LOG"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)" >> "$LOG" 2>&1
          rc=$?
          echo "install-theos rc=$rc" >> "$LOG"
          if [ "$rc" -ne 0 ] || [ -z "$(ls -d "$HOME/theos/sdks"/iPhoneOS*.sdk 2>/dev/null)" ]; then
            echo "### fallback: manual setup" >> "$LOG"
            brew install ldid xz >> "$LOG" 2>&1
            [ -d "$HOME/theos" ] || git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos" >> "$LOG" 2>&1
            rm -rf "$HOME/theos/sdks"
            mkdir -p "$HOME/theos/sdks"
            "$HOME/theos/bin/install-sdk" latest >> "$LOG" 2>&1
          fi
          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.5.sdk" ]; then
            echo "### ensure iPhoneOS16.5 sdk explicitly" >> "$LOG"
            "$HOME/theos/bin/install-sdk" iPhoneOS16.5 >> "$LOG" 2>&1 || true
          fi
          echo "=== sdks ===" >> "$LOG"
          ls -la "$HOME/theos/sdks" >> "$LOG" 2>&1
          echo "=== toolchain ===" >> "$LOG"
          ls "$HOME/theos/toolchain" >> "$LOG" 2>&1
          SDK_DIR="$(ls -d "$HOME/theos/sdks"/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDK_DIR" ]; then
            echo "INSTALL FAILED: no iPhoneOS sdk" >> "$LOG"
            exit 1
          fi
          SDK_VER="$(basename "$SDK_DIR" .sdk)"
          SDK_VER="${SDK_VER#iPhoneOS}"
          echo "using SDK: $SDK_VER" >> "$LOG"
          echo "SDKTARGET=iphone:clang:$SDK_VER:15.0" >> "$GITHUB_ENV"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Ensure GNU make
        run: |
          MAKE_BIN="$(brew --prefix)/opt/make/bin/gmake"
          if [ ! -x "$MAKE_BIN" ]; then
            brew install make 2>&1 | tee "$GITHUB_WORKSPACE/brew-make.log" || true
          fi
          if [ -x "$MAKE_BIN" ]; then
            "$MAKE_BIN" --version 2>/dev/null | head -1 | tee "$GITHUB_WORKSPACE/make-version.txt" || true
          else
            echo "GMAKE MISSING - will fall back to system make" | tee "$GITHUB_WORKSPACE/make-version.txt" || true
          fi

      - name: Generate tweak project
        run: |
          mkdir -p Fivecontrol
          cd Fivecontrol
          cat > Makefile <<'EOF_MAKEFILE'
          SDKTARGET ?= iphone:clang:16.5:15.0
          TARGET := $(SDKTARGET)
          ARCHS = arm64e
          THEOS_PACKAGE_SCHEME = roothide
          INSTALL_TARGET_PROCESSES = SpringBoard

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = Fivecontrol
          Fivecontrol_FILES = Tweak.xm
          Fivecontrol_CFLAGS = -fobjc-arc -Wno-error
          Fivecontrol_FRAMEWORKS = UIKit

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF_MAKEFILE
          cat > control <<'EOF_CONTROL'
          Package: com.henrymoveon.fivecontrol
          Name: Fivecontrol
          Version: 1.0.8
          Architecture: iphoneos-arm64e
          Description: Five columns in Control Center, 80 percent module scale, 33pt corner radius.
          Maintainer: HenryMoveOn
          Author: HenryMoveOn
          Section: Tweaks
          Depends: mobilesubstrate, firmware (>= 17.0)
          EOF_CONTROL
          cat > Fivecontrol.plist <<'EOF_FILTER'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.apple.springboard</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF_FILTER
          cat > Tweak.xm <<'EOF_TWEAK'
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <math.h>

          typedef struct { unsigned long long width; unsigned long long height; } FC_LayoutSize;
          typedef struct { unsigned long long x; unsigned long long y; } FC_LayoutPoint;

          #pragma mark - Tunables

          static BOOL       fcEnabled     = YES;
          static NSUInteger fcColumns     = 5;     // target column count
          static NSUInteger fcBaseColumns = 4;     // stock column count
          static CGFloat    fcScale       = 0.8;   // spacing scale; item edge is derived from it
          static CGFloat    fcCorner      = 33.0;  // max compact corner radius
          static CGFloat    fcFill        = 0.88;  // max fraction of the module the icon block may occupy
          static CGFloat    fcMinScale    = 0.50;  // safety clamp for the icon block
          static BOOL       fcDebug       = NO;

          #pragma mark - Layout options bookkeeping
          /* These ALWAYS hold the stock (un-scaled) values. Everything derived is
             recomputed from them, so repeated system setter calls can never compound. */

          static CGFloat fcBaseEdge       = 0;
          static CGFloat fcBaseSpacing    = 0;
          static BOOL    fcBaseSpacingSet = NO;
          static CGFloat fcAppliedEdge    = -1;    // last value we pushed back, used for re-entry detection
          static CGFloat fcAppliedSpacing = -1;
          static BOOL    fcApplying       = NO;    // guards our own re-entrant setter calls
          static BOOL    fcBusy           = NO;    // guards re-entrant layout passes

          static char kFCManagedKey;               // marks views whose scale/position we own

          #pragma mark - Interfaces

          @interface CCUIMutableLayoutOptions : NSObject
          - (void)setItemEdgeSize:(CGFloat)edgeSize;
          - (void)setItemSpacing:(CGFloat)itemSpacing;
          @end

          @interface CCUIControlCenterPositionProviderPackingRule : NSObject
          - (id)initWithPackFrom:(unsigned long long)arg1 packingOrder:(unsigned long long)arg2 sizeLimit:(FC_LayoutSize)arg3;
          @end

          @interface CCUIControlCenterPositionProvider : NSObject
          - (id)_generateRectByIdentifierWithOrderedIdentifiers:(NSArray *)identifiers orderedSizes:(NSArray *)sizes packingOrder:(unsigned long long)arg3 startPosition:(FC_LayoutPoint)arg4 maximumSize:(FC_LayoutSize)arg5 outputLayoutSize:(FC_LayoutSize *)arg6;
          @end

          @interface CCUIButtonModuleView : UIView
          @end

          @interface CCUIBaseSliderView : UIView
          @end

          @interface CCUILabeledRoundButton : UIView
          @end

          @interface CCUIContentModuleContentContainerView : UIView
          - (void)fc_centerContent;
          @end

          @interface CCUIContentModuleContainerViewController : UIViewController
          - (CGFloat)_continuousCornerRadiusForCompactState;
          @end

          #pragma mark - Helpers

          static inline void fc_markManaged(UIView *v) {
              objc_setAssociatedObject(v, &kFCManagedKey, @YES, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
          }

          static BOOL fc_isManaged(UIView *v) {
              UIView *c = v;
              for (int i = 0; i < 5 && c; i++, c = c.superview) {
                  if ([objc_getAssociatedObject(c, &kFCManagedKey) boolValue]) return YES;
              }
              return NO;
          }

          /* Outermost button-like views only: never descend into an already matched view,
             so a round button nested inside a button module view is not counted twice. */
          static NSArray *fc_findButtons(UIView *root) {
              Class moduleCls = NSClassFromString(@"CCUIButtonModuleView");
              Class roundCls  = NSClassFromString(@"CCUILabeledRoundButton");
              if (!moduleCls && !roundCls) return @[];

              NSMutableArray *out   = [NSMutableArray array];
              NSMutableArray *stack = [NSMutableArray arrayWithObject:root];
              while (stack.count) {
                  UIView *v = stack.lastObject;
                  [stack removeLastObject];
                  for (UIView *s in v.subviews) {
                      BOOL hit = (moduleCls && [s isKindOfClass:moduleCls]) ||
                                 (roundCls  && [s isKindOfClass:roundCls]);
                      if (hit) [out addObject:s];
                      else     [stack addObject:s];
                  }
              }
              return out;
          }

          /* Push the derived edge/spacing back through the public setters so every
             consumer (module grid, KVO, internal constraints) sees one consistent value. */
          static void fc_applyLayoutOptions(id opts) {
              if (!opts || !fcEnabled || fcColumns == 0 || fcBaseEdge <= 0) return;

              CGFloat spacing = fcBaseSpacingSet ? fcBaseSpacing : 0.0;
              CGFloat total   = fcBaseEdge * (CGFloat)fcBaseColumns
                              + spacing * (CGFloat)(fcBaseColumns - 1);
              CGFloat newSp   = spacing * fcScale;
              CGFloat newEdge = (total - newSp * (CGFloat)(fcColumns - 1)) / (CGFloat)fcColumns;
              if (newEdge <= 0) return;

              fcApplying      = YES;
              fcAppliedEdge   = newEdge;
              [opts setItemEdgeSize:newEdge];
              if (fcBaseSpacingSet) {
                  fcAppliedSpacing = newSp;
                  [opts setItemSpacing:newSp];
              }
              fcApplying = NO;
          }

          %group Fivecontrol

          #pragma mark - Module grid: 4 -> 5 columns

          %hook CCUIMutableLayoutOptions

          // Keep the orig call on its own line at the end of the method: a one-line
          // block "{ orig; return; }" makes the Logos preprocessor drop the closing
          // brace and the next method then fails to compile.
          - (void)setItemEdgeSize:(CGFloat)edgeSize {
              // fcAppliedEdge == value we pushed ourselves -> already scaled, never twice
              BOOL ours = (fcAppliedEdge > 0 && fabs(edgeSize - fcAppliedEdge) < 0.01);
              if (fcEnabled && !fcApplying && !ours) {
                  fcBaseEdge = edgeSize;
                  fc_applyLayoutOptions(self);
                  return;
              }
              %orig;
          }

          - (void)setItemSpacing:(CGFloat)itemSpacing {
              BOOL ours = (fcAppliedSpacing > 0 && fabs(itemSpacing - fcAppliedSpacing) < 0.01);
              if (fcEnabled && !fcApplying && !ours) {
                  fcBaseSpacing    = itemSpacing;
                  fcBaseSpacingSet = YES;
                  if (fcBaseEdge > 0) {
                      fc_applyLayoutOptions(self);
                      return;
                  }
              }
              %orig;
          }

          %end

          %hook CCUIControlCenterPositionProviderPackingRule

          - (id)initWithPackFrom:(unsigned long long)arg1 packingOrder:(unsigned long long)arg2 sizeLimit:(FC_LayoutSize)arg3 {
              if (fcEnabled && arg3.width > 0 && arg3.width < 10) arg3.width = fcColumns;
              return %orig;
          }

          %end

          %hook CCUIControlCenterPositionProvider

          - (id)_generateRectByIdentifierWithOrderedIdentifiers:(NSArray *)identifiers
                                                    orderedSizes:(NSArray *)sizes
                                                    packingOrder:(unsigned long long)arg3
                                                   startPosition:(FC_LayoutPoint)arg4
                                                     maximumSize:(FC_LayoutSize)arg5
                                                outputLayoutSize:(FC_LayoutSize *)arg6 {
              if (fcEnabled && arg5.width > 0 && arg5.width < 10) arg5.width = fcColumns;
              return %orig;
          }

          %end

          #pragma mark - Module chrome

          %hook CCUIContentModuleContainerViewController

          - (CGFloat)_continuousCornerRadiusForCompactState {
              if (!fcEnabled) return %orig;
              CGFloat w = self.view.bounds.size.width;
              if (w <= 0) return %orig;
              return MIN(fcCorner, w * 0.30);
          }

          %end

          #pragma mark - Fallback glyph scaling (1x1 modules, sliders)

          %hook CCUIButtonModuleView

          - (void)didMoveToWindow {
              %orig;
              if (!fcEnabled || fc_isManaged(self)) return;   // already scaled by fc_centerContent
              Class capCls = NSClassFromString(@"CCUICAPackageView");
              if (!capCls) return;
              for (UIView *sub in self.subviews) {
                  if ([sub isKindOfClass:capCls]) sub.transform = CGAffineTransformMakeScale(fcScale, fcScale);
              }
          }

          %end

          %hook CCUILabeledRoundButton

          - (void)didMoveToWindow {
              %orig;
              if (!fcEnabled || fc_isManaged(self)) return;   // part of a managed 2x2 block
              self.transform = CGAffineTransformMakeScale(fcScale, fcScale);
          }

          %end

          %hook CCUIBaseSliderView

          - (void)didMoveToWindow {
              %orig;
              if (!fcEnabled || fc_isManaged(self)) return;
              Class capCls = NSClassFromString(@"CCUICAPackageView");
              if (!capCls) return;
              for (UIView *sub in self.subviews) {
                  if ([sub isKindOfClass:capCls]) sub.transform = CGAffineTransformMakeScale(fcScale, fcScale);
              }
          }

          %end

          #pragma mark - 2x2 icon block: fit + centre

          %hook CCUIContentModuleContentContainerView

          - (void)didMoveToWindow {
              %orig;
              [self fc_centerContent];
          }

          - (void)layoutSubviews {
              %orig;
              [self fc_centerContent];
          }

          %new
          - (void)fc_centerContent {
              if (!fcEnabled || fcBusy) return;
              CGSize size = self.bounds.size;
              if (size.width <= 0 || size.height <= 0) return;
              if (size.width > size.height * 1.2) return;      // expanded / non-square module: untouched

              NSArray *btns = fc_findButtons(self);
              if (btns.count < 2) return;                      // 1x1 module: legacy path handles it

              fcBusy = YES;

              // Common superview of the whole icon block.
              UIView *grid = [btns[0] superview];
              for (UIView *b in btns) {
                  if (b.superview != grid) { grid = nil; break; }
              }
              if (grid == self) grid = nil;                    // never transform the container itself

              // 1) neutral state -> pure layout geometry
              UIView *scaleTarget = grid;
              if (scaleTarget) scaleTarget.transform = CGAffineTransformIdentity;
              else             for (UIView *b in btns) b.transform = CGAffineTransformIdentity;

              CGRect u = CGRectNull;
              for (UIView *b in btns) {
                  CGRect r = [self convertRect:b.bounds fromView:b];
                  u = CGRectIsNull(u) ? r : CGRectUnion(u, r);
              }
              if (CGRectIsNull(u) || u.size.width <= 0 || u.size.height <= 0) { fcBusy = NO; return; }

              // 2) shrink the block (sizes AND gaps) only as far as needed to fit
              CGFloat s = MIN((CGFloat)1.0, MIN(size.width * fcFill / u.size.width,
                                                size.height * fcFill / u.size.height));
              if (s < fcMinScale) s = fcMinScale;

              CGAffineTransform scaled = CGAffineTransformMakeScale(s, s);
              if (scaleTarget) scaleTarget.transform = scaled;
              else             for (UIView *b in btns) b.transform = scaled;

              // 3) measure the block again WITH the scale applied, then translate the
              //    remaining offset away. Works whatever the layer anchorPoint is.
              CGRect v = CGRectNull;
              for (UIView *b in btns) {
                  CGRect r = [self convertRect:b.bounds fromView:b];
                  v = CGRectIsNull(v) ? r : CGRectUnion(v, r);
              }
              if (CGRectIsNull(v)) { fcBusy = NO; return; }
              CGPoint d = CGPointMake(size.width * 0.5 - CGRectGetMidX(v),
                                      size.height * 0.5 - CGRectGetMidY(v));

              CGAffineTransform t = CGAffineTransformTranslate(scaled, d.x, d.y);
              if (scaleTarget) { scaleTarget.transform = t; fc_markManaged(scaleTarget); }
              else             for (UIView *b in btns) { b.transform = t; fc_markManaged(b); }

              if (fcDebug) NSLog(@"[Fivecontrol] n=%lu s=%.3f d=(%.1f,%.1f) union=%@ scaled=%@ bounds=%@",
                                 (unsigned long)btns.count, s, d.x, d.y, NSStringFromCGRect(u),
                                 NSStringFromCGRect(v), NSStringFromCGRect(self.bounds));

              fcBusy = NO;
          }

          %end

          %end

          %ctor {
              if (!objc_getClass("CCUIMutableLayoutOptions")) {
                  NSLog(@"[Fivecontrol] CCUIMutableLayoutOptions not found - layout hook may be skipped");
              }
              %init(Fivecontrol);
          }
          EOF_TWEAK

      - name: Build deb
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          MAKE_BIN="$(brew --prefix)/opt/make/bin/gmake"
          if [ ! -x "$MAKE_BIN" ]; then
            echo "!!! gmake missing at build time" | tee build.log
            MAKE_BIN="make"
          fi
          {
            echo "===== DIAG ====="
            echo "SDKTARGET=${SDKTARGET:-unset}"
            echo "make: $("$MAKE_BIN" --version 2>/dev/null | head -1)"
            ls -d "$THEOS/sdks"/iPhoneOS*.sdk 2>/dev/null || true
            clang --version 2>&1 | head -2 || true
            echo "===== MAKE ====="
          } 2>&1 | tee -a build.log
          cd Fivecontrol
          "$MAKE_BIN" package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee -a ../build.log

      - name: Show compile errors
        if: steps.build.outcome == 'failure'
        run: |
          grep -n -E "error:" build.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Save build log to ci-log branch
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          MAIN_SHA="$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | sed -n 's/.*"sha": *"\([0-9a-f]\{40\}\)".*/\1/p' | head -1)"
          if [ -n "$MAIN_SHA" ]; then
            curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" \
              -d "{\"ref\":\"refs/heads/ci-log\",\"sha\":\"$MAIN_SHA\"}" >/dev/null 2>&1 || true
          fi
          {
            echo "===== META ====="
            echo "run=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA build_outcome=${{ steps.build.outcome }}"
            echo
            echo "===== MAKE VERSION ====="
            cat make-version.txt 2>/dev/null
            echo
            echo "===== DEB PRODUCED? ====="
            ls -la Fivecontrol/packages/ 2>/dev/null || true
            echo
            echo "===== DEB CONTENTS ====="
            for d in Fivecontrol/packages/*.deb; do
              [ -e "$d" ] && { echo ">> $d"; dpkg-deb -c "$d" 2>/dev/null | sed 's#^#  #'; } || true
            done
            echo
            echo "===== INSTALL LOG TAIL (60) ====="
            tail -n 60 install.log 2>/dev/null || true
            echo
            echo "===== BUILD LOG (last 150 lines) ====="
            tail -n 150 build.log 2>/dev/null || true
          } > build-log.txt
          wc -c build-log.txt
          B64="$(base64 < build-log.txt | tr -d '\n')"
          SHA="$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-log.txt?ref=ci-log" \
            | grep '"sha"' | head -1 | sed -E 's/.*"sha": *"([^"]+)".*/\1/')"
          if [ -n "$SHA" ]; then
            PAYLOAD="{\"message\":\"ci log [skip ci]\",\"content\":\"$B64\",\"branch\":\"ci-log\",\"sha\":\"$SHA\"}"
          else
            PAYLOAD="{\"message\":\"ci log [skip ci]\",\"content\":\"$B64\",\"branch\":\"ci-log\"}"
          fi
          curl -sS -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-log.txt" \
            -d "$PAYLOAD" | head -c 500 || true

      - name: Upload deb
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Fivecontrol-deb
          path: Fivecontrol/packages/*.deb

      - name: Publish release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Fivecontrol build ${{ github.run_number }}
          files: Fivecontrol/packages/*.deb

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
