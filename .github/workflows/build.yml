name: Build Fivecontrol

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (roothide)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/install.log"
          : > "$LOG"
          echo "### attempt: install-theos (authenticated)" >> "$LOG"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)" >> "$LOG" 2>&1
          rc=$?
          echo "install-theos rc=$rc" >> "$LOG"
          if [ "$rc" -ne 0 ] || [ -z "$(ls -d "$HOME/theos/sdks"/iPhoneOS*.sdk 2>/dev/null)" ]; then
            echo "### fallback: manual setup" >> "$LOG"
            brew install ldid xz >> "$LOG" 2>&1
            [ -d "$HOME/theos" ] || git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos" >> "$LOG" 2>&1
            rm -rf "$HOME/theos/sdks"
            mkdir -p "$HOME/theos/sdks"
            "$HOME/theos/bin/install-sdk" latest >> "$LOG" 2>&1
          fi
          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.5.sdk" ]; then
            echo "### ensure iPhoneOS16.5 sdk explicitly" >> "$LOG"
            "$HOME/theos/bin/install-sdk" iPhoneOS16.5 >> "$LOG" 2>&1 || true
          fi
          echo "=== sdks ===" >> "$LOG"
          ls -la "$HOME/theos/sdks" >> "$LOG" 2>&1
          echo "=== toolchain ===" >> "$LOG"
          ls "$HOME/theos/toolchain" >> "$LOG" 2>&1
          SDK_DIR="$(ls -d "$HOME/theos/sdks"/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDK_DIR" ]; then
            echo "INSTALL FAILED: no iPhoneOS sdk" >> "$LOG"
            exit 1
          fi
          SDK_VER="$(basename "$SDK_DIR" .sdk)"
          SDK_VER="${SDK_VER#iPhoneOS}"
          echo "using SDK: $SDK_VER" >> "$LOG"
          echo "SDKTARGET=iphone:clang:$SDK_VER:15.0" >> "$GITHUB_ENV"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Ensure GNU make
        run: |
          MAKE_BIN="$(brew --prefix)/opt/make/bin/gmake"
          if [ ! -x "$MAKE_BIN" ]; then
            brew install make 2>&1 | tee "$GITHUB_WORKSPACE/brew-make.log" || true
          fi
          if [ -x "$MAKE_BIN" ]; then
            "$MAKE_BIN" --version 2>/dev/null | head -1 | tee "$GITHUB_WORKSPACE/make-version.txt" || true
          else
            echo "GMAKE MISSING - will fall back to system make" | tee "$GITHUB_WORKSPACE/make-version.txt" || true
          fi

      - name: Generate tweak project
        run: |
          mkdir -p Fivecontrol
          cd Fivecontrol
          cat > Makefile <<'EOF_MAKEFILE'
          SDKTARGET ?= iphone:clang:16.5:15.0
          TARGET := $(SDKTARGET)
          ARCHS = arm64e
          THEOS_PACKAGE_SCHEME = roothide
          INSTALL_TARGET_PROCESSES = SpringBoard

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = Fivecontrol
          Fivecontrol_FILES = Tweak.xm
          Fivecontrol_CFLAGS = -fobjc-arc -Wno-error
          Fivecontrol_FRAMEWORKS = UIKit

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF_MAKEFILE
          cat > control <<'EOF_CONTROL'
          Package: com.henrymoveon.fivecontrol
          Name: Fivecontrol
          Version: 1.1.2
          Architecture: iphoneos-arm64e
          Description: Five columns in Control Center, 80 percent module scale, 33pt corner radius.
          Maintainer: HenryMoveOn
          Author: HenryMoveOn
          Section: Tweaks
          Depends: mobilesubstrate, firmware (>= 17.0)
          EOF_CONTROL
          cat > Fivecontrol.plist <<'EOF_FILTER'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.apple.springboard</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF_FILTER
          cat > Tweak.xm <<'EOF_TWEAK'
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          typedef struct { unsigned long long width; unsigned long long height; } FC_LayoutSize;
          typedef struct { unsigned long long x; unsigned long long y; } FC_LayoutPoint;

          static BOOL fcEnabled = YES;
          static NSUInteger fcColumns = 5;
          static CGFloat fcScale = 0.8;
          static CGFloat fcCorner = 33.0;
          static CGFloat fcShiftDown = 15.0;
          static CGFloat fcEdge = 0;
          static CGFloat fcSpacing = 0;

          static inline CGFloat fc_getIvar(id obj, const char *name) {
              Ivar iv = class_getInstanceVariable([obj class], name);
              if (!iv) return 0;
              return *(CGFloat *)((char *)(__bridge void *)obj + ivar_getOffset(iv));
          }

          static inline void fc_setIvar(id obj, const char *name, CGFloat v) {
              Ivar iv = class_getInstanceVariable([obj class], name);
              if (!iv) return;
              *(CGFloat *)((char *)(__bridge void *)obj + ivar_getOffset(iv)) = v;
          }

          static Class fc_roundButtonClass(void) {
              static Class cls = nil;
              if (!cls) cls = NSClassFromString(@"CCUILabeledRoundButton");
              return cls;
          }

          // Recursively collect CCUILabeledRoundButton views (the 2x2 connectivity
          // module's four keys), bailing out early once more than 4 are found.
          static void fc_collectRoundButtons(UIView *view, NSMutableArray *out) {
              Class target = fc_roundButtonClass();
              if (!target) return;
              for (UIView *sub in view.subviews) {
                  if ([sub isKindOfClass:target]) {
                      [out addObject:sub];
                  } else {
                      fc_collectRoundButtons(sub, out);
                  }
                  if (out.count > 4) return;
              }
          }

          // Rate-limited NSLog for on-device diagnostics. Inspect on the device
          // with `log stream | grep Fivecontrol` (over SSH) or Console.app.
          static void fc_log(NSString *msg) {
              static NSDate *fc_lastLog = nil;
              NSDate *now = [NSDate date];
              if (fc_lastLog && [now timeIntervalSinceDate:fc_lastLog] < 1.0) return;
              fc_lastLog = now;
              NSLog(@"[Fivecontrol] %@", msg);
          }

          // Associated-object keys remembering the STOCK (pre-hook) layout
          // values per CCUIMutableLayoutOptions instance, so the 4->5 column
          // reduction is always derived from the same original pair.
          // NOTE: must be `const void *` - ARC forbids passing an NSString *
          // to objc_get/setAssociatedObject without a bridge cast.
          static const void *kFCStockEdgeKey = &kFCStockEdgeKey;
          static const void *kFCStockSpacingKey = &kFCStockSpacingKey;

          // Most recent STOCK pair, process-wide. A mutableCopy of an already
          // reduced options object inherits our reduced ivars but no associated
          // stock, so the inherited value is restored from here when it matches
          // the reduction signature exactly.
          static CGFloat fcRefEdge = 0;
          static CGFloat fcRefSpacing = 0;

          // The enclosing CCUIContentModuleContainerViewController's view, or nil.
          static UIView *fc_moduleContainerView(UIView *v) {
              static Class cls = nil;
              if (!cls) cls = NSClassFromString(@"CCUIContentModuleContainerViewController");
              if (!cls) return nil;
              for (UIView *a = v; a; a = a.superview) {
                  UIResponder *r = a.nextResponder;
                  if ([r isKindOfClass:cls]) return [(UIViewController *)r view];
              }
              return nil;
          }

          @interface CCUIMutableLayoutOptions : NSObject
          - (void)setItemEdgeSize:(CGFloat)edgeSize;
          - (void)setItemSpacing:(CGFloat)itemSpacing;
          - (void)fc_recalculateWithFreshEdge:(CGFloat)freshEdge;
          - (void)fc_recalculateWithFreshSpacing:(CGFloat)freshSpacing;
          - (void)fc_applyStockEdge:(CGFloat)stockEdge stockSpacing:(CGFloat)stockSpacing;
          @end

          @interface CCUIControlCenterPositionProviderPackingRule : NSObject
          - (id)initWithPackFrom:(unsigned long long)arg1 packingOrder:(unsigned long long)arg2 sizeLimit:(FC_LayoutSize)arg3;
          @end

          @interface CCUIControlCenterPositionProvider : NSObject
          - (id)_generateRectByIdentifierWithOrderedIdentifiers:(NSArray *)identifiers orderedSizes:(NSArray *)sizes packingOrder:(unsigned long long)arg3 startPosition:(FC_LayoutPoint)arg4 maximumSize:(FC_LayoutSize)arg5 outputLayoutSize:(FC_LayoutSize *)arg6;
          @end

          @interface CCUIButtonModuleView : UIView
          - (void)_setGlyphImage:(UIImage *)image;
          @end

          @interface CCUILabeledRoundButton : UIView
          - (void)fc_recenterInSiblings;
          @end

          @interface CCUIBaseSliderView : UIView
          @end

          @interface CCUIContentModuleContainerViewController : UIViewController
          - (CGFloat)_continuousCornerRadiusForCompactState;
          - (void)fc_recenterConnectivityButtons;
          @end

          %group Fivecontrol

          %hook CCUIMutableLayoutOptions

          - (void)setItemEdgeSize:(CGFloat)edgeSize {
              %orig;
              [self fc_recalculateWithFreshEdge:edgeSize];
          }

          - (void)setItemSpacing:(CGFloat)itemSpacing {
              %orig;
              [self fc_recalculateWithFreshSpacing:itemSpacing];
          }

          // The value the system just passed to the edge setter is
          // authoritative. The spacing is restored from the remembered stock
          // pair - reading the current ivar would compound our own reduction
          // across layout passes.
          %new
          - (void)fc_recalculateWithFreshEdge:(CGFloat)freshEdge {
              CGFloat stockSpacing;
              NSNumber *stockSpacingN = objc_getAssociatedObject(self, kFCStockSpacingKey);
              if (stockSpacingN) {
                  stockSpacing = stockSpacingN.doubleValue;
              } else {
                  stockSpacing = fc_getIvar(self, "_itemSpacing");
                  if (fcRefSpacing > 0 && fabs(stockSpacing - fcRefSpacing * fcScale) < 0.5) {
                      stockSpacing = fcRefSpacing;
                  }
              }
              CGFloat stockEdge = freshEdge;
              NSNumber *stockEdgeN = objc_getAssociatedObject(self, kFCStockEdgeKey);
              if (stockEdgeN) {
                  CGFloat prevEdge = stockEdgeN.doubleValue;
                  CGFloat reducedEdge = (prevEdge * 4 + stockSpacing * 3
                                         - stockSpacing * fcScale * 4) / (CGFloat)fcColumns;
                  // Ignore our own reduced value being re-fed into the setter.
                  if (fabs(freshEdge - reducedEdge) < 0.5) stockEdge = prevEdge;
              }
              [self fc_applyStockEdge:stockEdge stockSpacing:stockSpacing];
          }

          // Mirror of the above for the spacing setter.
          %new
          - (void)fc_recalculateWithFreshSpacing:(CGFloat)freshSpacing {
              CGFloat stockEdge;
              NSNumber *stockEdgeN = objc_getAssociatedObject(self, kFCStockEdgeKey);
              if (stockEdgeN) {
                  stockEdge = stockEdgeN.doubleValue;
              } else {
                  stockEdge = fc_getIvar(self, "_itemEdgeSize");
                  if (fcRefEdge > 0 && fcRefSpacing > 0) {
                      CGFloat reducedRef = (fcRefEdge * 4 + fcRefSpacing * 3
                                            - fcRefSpacing * fcScale * 4) / (CGFloat)fcColumns;
                      if (reducedRef > 0 && fabs(stockEdge - reducedRef) < 0.5) {
                          stockEdge = fcRefEdge;
                      }
                  }
              }
              CGFloat stockSpacing = freshSpacing;
              NSNumber *stockSpacingN = objc_getAssociatedObject(self, kFCStockSpacingKey);
              if (stockSpacingN) {
                  // Ignore our own reduced value being re-fed into the setter.
                  if (fabs(freshSpacing - stockSpacingN.doubleValue * fcScale) < 0.5) {
                      stockSpacing = stockSpacingN.doubleValue;
                  }
              }
              [self fc_applyStockEdge:stockEdge stockSpacing:stockSpacing];
          }

          // Derive the 4->5 column reduction from the remembered STOCK pair.
          // Recomputing from the already-reduced values drifts further on
          // every setter call (mutableCopy + a single setter compounds the
          // reduction), which leaves the module size and the internal grid
          // computed from different states.
          %new
          - (void)fc_applyStockEdge:(CGFloat)stockEdge stockSpacing:(CGFloat)stockSpacing {
              if (!fcEnabled || fcColumns < 5) return;
              if (stockEdge <= 0 || stockSpacing <= 0) return;
              objc_setAssociatedObject(self, kFCStockEdgeKey, @(stockEdge), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              objc_setAssociatedObject(self, kFCStockSpacingKey, @(stockSpacing), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              fcRefEdge = stockEdge;
              fcRefSpacing = stockSpacing;
              CGFloat totalWidth = stockEdge * 4 + stockSpacing * 3;
              CGFloat newSpacing = stockSpacing * fcScale;
              CGFloat newEdge = (totalWidth - newSpacing * 4) / (CGFloat)fcColumns;
              if (newEdge > 0) {
                  fcEdge = newEdge;
                  fcSpacing = newSpacing;
                  fc_setIvar(self, "_itemEdgeSize", newEdge);
                  fc_setIvar(self, "_itemSpacing", newSpacing);
              }
          }

          %end

          %hook CCUIControlCenterPositionProviderPackingRule

          - (id)initWithPackFrom:(unsigned long long)arg1 packingOrder:(unsigned long long)arg2 sizeLimit:(FC_LayoutSize)arg3 {
              if (fcEnabled) {
                  if (arg3.width < 10) arg3.width = fcColumns;
              }
              return %orig;
          }

          %end

          %hook CCUIControlCenterPositionProvider

          - (id)_generateRectByIdentifierWithOrderedIdentifiers:(NSArray *)identifiers
                                                    orderedSizes:(NSArray *)sizes
                                                    packingOrder:(unsigned long long)arg3
                                                   startPosition:(FC_LayoutPoint)arg4
                                                     maximumSize:(FC_LayoutSize)arg5
                                                outputLayoutSize:(FC_LayoutSize *)arg6 {
              if (fcEnabled) {
                  if (arg5.width < 10) {
                      fc_log([NSString stringWithFormat:@"provider: %lu modules, maximumSize.width %llu -> %lu",
                              (unsigned long)identifiers.count, arg5.width,
                              (unsigned long)fcColumns]);
                      arg5.width = fcColumns;
                  }
              }
              return %orig;
          }

          %end

          %hook CCUIContentModuleContainerViewController

          - (CGFloat)_continuousCornerRadiusForCompactState {
              if (!fcEnabled) return %orig;
              CGFloat w = self.view.bounds.size.width;
              if (w <= 0) return %orig;
              CGFloat r = w * 0.30;
              return (r > fcCorner) ? fcCorner : r;
          }

          - (void)viewDidLayoutSubviews {
              %orig;
              [self fc_recenterConnectivityButtons];
          }

          %new
          - (void)fc_recenterConnectivityButtons {
              if (!fcEnabled) return;
              UIView *v = self.view;
              if (!v) return;
              CGRect b = v.bounds;
              if (b.size.width <= 0 || b.size.height <= 0) return;

              // Only the 2x2 connectivity module: its container holds exactly
              // four CCUILabeledRoundButton views.
              NSMutableArray *btns = [NSMutableArray array];
              fc_collectRoundButtons(v, btns);
              fc_log([NSString stringWithFormat:@"container %@: %lu round buttons, bounds %.0fx%.0f",
                      NSStringFromClass([self class]), (unsigned long)btns.count,
                      (double)b.size.width, (double)b.size.height]);
              if (btns.count != 4) return;

              // Union bbox of the four keys, converted into the module's own
              // coordinate space (works through any intermediate views and the
              // 0.8 scale transform).
              CGRect u = CGRectNull;
              for (UIView *btn in btns) {
                  if (!btn.superview) return;
                  u = CGRectUnion(u, [v convertRect:btn.bounds fromView:btn]);
              }
              if (CGRectIsNull(u) || u.size.width <= 0 || u.size.height <= 0) return;

              // Translate only - keep every key's size and the grid spacing.
              // This re-centers the 2x2 grid after the stock layout has placed
              // it off-center, and re-runs on every layout pass so it always wins.
              CGFloat dx = b.size.width  * 0.5 - (u.origin.x + u.size.width  * 0.5);
              CGFloat dy = b.size.height * 0.5 - (u.origin.y + u.size.height * 0.5);
              if (fabs(dx) < 0.25 && fabs(dy) < 0.25) return;
              fc_log([NSString stringWithFormat:@"container recenter: union (%.0f,%.0f,%.0f,%.0f) move (%+.1f,%+.1f)",
                      (double)u.origin.x, (double)u.origin.y,
                      (double)u.size.width, (double)u.size.height,
                      (double)dx, (double)dy]);
              for (UIView *btn in btns) {
                  CGPoint c = [v convertPoint:btn.center fromView:btn.superview];
                  c.x += dx;
                  c.y += dy;
                  btn.center = [v convertPoint:c toView:btn.superview];
              }
          }

          %end

          %hook CCUIButtonModuleView

          - (void)didMoveToWindow {
              %orig;
              if (!fcEnabled) return;
              Class capCls = NSClassFromString(@"CCUICAPackageView");
              for (UIView *sub in self.subviews) {
                  if (capCls && [sub isKindOfClass:capCls]) {
                      CGAffineTransform t = CGAffineTransformMakeScale(fcScale, fcScale);
                      t = CGAffineTransformConcat(t, CGAffineTransformMakeTranslation(0, fcShiftDown));
                      sub.transform = t;
                  }
              }
          }

          - (void)layoutSubviews {
              %orig;
              if (!fcEnabled) return;
              Class capCls = NSClassFromString(@"CCUICAPackageView");
              for (UIView *sub in self.subviews) {
                  if (capCls && [sub isKindOfClass:capCls]) {
                      CGAffineTransform t = CGAffineTransformMakeScale(fcScale, fcScale);
                      t = CGAffineTransformConcat(t, CGAffineTransformMakeTranslation(0, fcShiftDown));
                      sub.transform = t;
                  }
              }
          }

          %end

          %hook CCUILabeledRoundButton

          - (void)didMoveToWindow {
              %orig;
              if (!fcEnabled) return;
              self.transform = CGAffineTransformMakeScale(fcScale, fcScale);
          }

          - (void)layoutSubviews {
              %orig;
              [self fc_recenterInSiblings];
          }

          // Second, independent recenter path: fires whenever a key itself
          // lays out, which also covers the case where the container-level
          // hook ran before the keys had been positioned. It targets the same
          // centre (the enclosing module container) as the container hook, so
          // the two can never fight over the position.
          %new
          - (void)fc_recenterInSiblings {
              if (!fcEnabled) return;
              UIView *parent = self.superview;
              if (!parent) return;

              // Only the 2x2 connectivity module has four round buttons
              // sharing one direct parent.
              NSMutableArray *btns = [NSMutableArray array];
              Class target = fc_roundButtonClass();
              if (!target) return;
              for (UIView *s in parent.subviews) {
                  if ([s isKindOfClass:target]) [btns addObject:s];
              }
              if (btns.count != 4) return;

              // Leader election: only the first key moves the group, so the
              // delta is applied exactly once per pass.
              if (btns.firstObject != self) return;

              UIView *targetView = fc_moduleContainerView(parent);
              if (!targetView) return;
              CGRect b = targetView.bounds;
              if (b.size.width <= 0 || b.size.height <= 0) return;

              CGRect u = CGRectNull;
              for (UIView *btn in btns) {
                  u = CGRectUnion(u, [targetView convertRect:btn.bounds fromView:btn]);
              }
              if (CGRectIsNull(u) || u.size.width <= 0 || u.size.height <= 0) return;

              CGFloat dx = b.size.width  * 0.5 - (u.origin.x + u.size.width  * 0.5);
              CGFloat dy = b.size.height * 0.5 - (u.origin.y + u.size.height * 0.5);
              if (fabs(dx) < 0.25 && fabs(dy) < 0.25) return;
              for (UIView *btn in btns) {
                  CGPoint c = [targetView convertPoint:btn.center fromView:btn.superview];
                  c.x += dx;
                  c.y += dy;
                  btn.center = [targetView convertPoint:c toView:btn.superview];
              }
              fc_log([NSString stringWithFormat:@"roundButton recenter: parent %@, move (%+.1f,%+.1f)",
                      NSStringFromClass([parent class]), (double)dx, (double)dy]);
          }

          %end

          %hook CCUIBaseSliderView

          - (void)didMoveToWindow {
              %orig;
              if (!fcEnabled) return;
              Class capCls = NSClassFromString(@"CCUICAPackageView");
              for (UIView *sub in self.subviews) {
                  if (capCls && [sub isKindOfClass:capCls]) {
                      sub.transform = CGAffineTransformMakeScale(fcScale, fcScale);
                  }
              }
          }

          %end





          %end

          %ctor {
              Class optCls = objc_getClass("CCUIMutableLayoutOptions");
              Class btnCls = fc_roundButtonClass();
              Class contCls = objc_getClass("CCUIContentModuleContainerViewController");
              Class provCls = objc_getClass("CCUIControlCenterPositionProvider");
              NSLog(@"[Fivecontrol] init on iOS %@ (options=%d roundButton=%d container=%d provider=%d)",
                    [UIDevice currentDevice].systemVersion,
                    optCls != nil, btnCls != nil, contCls != nil, provCls != nil);
              if (!optCls) {
                  NSLog(@"[Fivecontrol] CCUIMutableLayoutOptions not found - layout hook skipped");
              }
              %init(Fivecontrol);
          }
          EOF_TWEAK

      - name: Build deb
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          MAKE_BIN="$(brew --prefix)/opt/make/bin/gmake"
          if [ ! -x "$MAKE_BIN" ]; then
            echo "!!! gmake missing at build time" | tee build.log
            MAKE_BIN="make"
          fi
          {
            echo "===== DIAG ====="
            echo "SDKTARGET=${SDKTARGET:-unset}"
            echo "make: $("$MAKE_BIN" --version 2>/dev/null | head -1)"
            ls -d "$THEOS/sdks"/iPhoneOS*.sdk 2>/dev/null || true
            clang --version 2>&1 | head -2 || true
            echo "===== MAKE ====="
          } 2>&1 | tee -a build.log
          cd Fivecontrol
          "$MAKE_BIN" package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee -a ../build.log

      - name: Show compile errors
        if: steps.build.outcome == 'failure'
        run: |
          grep -n -E "error:" build.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Save build log to ci-log branch
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          MAIN_SHA="$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | sed -n 's/.*"sha": *"\([0-9a-f]\{40\}\)".*/\1/p' | head -1)"
          if [ -n "$MAIN_SHA" ]; then
            curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" \
              -d "{\"ref\":\"refs/heads/ci-log\",\"sha\":\"$MAIN_SHA\"}" >/dev/null 2>&1 || true
          fi
          {
            echo "===== META ====="
            echo "run=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA build_outcome=${{ steps.build.outcome }}"
            echo
            echo "===== MAKE VERSION ====="
            cat make-version.txt 2>/dev/null
            echo
            echo "===== DEB PRODUCED? ====="
            ls -la Fivecontrol/packages/ 2>/dev/null || true
            echo
            echo "===== DEB CONTENTS ====="
            for d in Fivecontrol/packages/*.deb; do
              [ -e "$d" ] && { echo ">> $d"; dpkg-deb -c "$d" 2>/dev/null | sed 's#^#  #'; } || true
            done
            echo
            echo "===== INSTALL LOG TAIL (60) ====="
            tail -n 60 install.log 2>/dev/null || true
            echo
            echo "===== BUILD LOG (last 150 lines) ====="
            tail -n 150 build.log 2>/dev/null || true
          } > build-log.txt
          wc -c build-log.txt
          B64="$(base64 < build-log.txt | tr -d '\n')"
          SHA="$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-log.txt?ref=ci-log" \
            | grep '"sha"' | head -1 | sed -E 's/.*"sha": *"([^"]+)".*/\1/')"
          if [ -n "$SHA" ]; then
            PAYLOAD="{\"message\":\"ci log [skip ci]\",\"content\":\"$B64\",\"branch\":\"ci-log\",\"sha\":\"$SHA\"}"
          else
            PAYLOAD="{\"message\":\"ci log [skip ci]\",\"content\":\"$B64\",\"branch\":\"ci-log\"}"
          fi
          curl -sS -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-log.txt" \
            -d "$PAYLOAD" | head -c 500 || true

      - name: Upload deb
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Fivecontrol-deb
          path: Fivecontrol/packages/*.deb

      - name: Publish release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Fivecontrol build ${{ github.run_number }}
          files: Fivecontrol/packages/*.deb

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
